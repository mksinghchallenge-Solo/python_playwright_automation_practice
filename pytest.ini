[pytest]
# ---------------------------------------------------------------------------
# Coca-Cola Automation Framework - pytest configuration
# ---------------------------------------------------------------------------
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra           : summary of all non-passing outcomes
# --strict-markers : typos in markers fail fast instead of silently passing
# Allure/JUnit output paths are injected per execution by conftest.py
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider
    --color=yes

log_cli = false
log_level = INFO

# Playwright defaults (overridable on the command line)
# --browser is added by conftest from config.yaml when not provided.

markers =
    smoke: fast critical-path checks
    regression: full regression coverage
    api: API layer tests (auto-added for tests/api)
    ui: UI layer tests (auto-added for tests/ui)
    e2e: API+UI end-to-end tests (auto-added for tests/e2e)
    framework: framework self-tests (auto-added for tests/framework)
    auth: authentication features
    profile: profile features
    content: content features
    navigation: navigation features
    negative: negative / error-path tests
    boundary: boundary-value tests
    schema: JSON-schema validation tests
    contract: contract tests
    accessibility: axe-core accessibility scans
    links: broken-link checks
    performance: response-time checks
    mocked: uses mocked/stubbed APIs (never a real integration test)
    read_only: safety - only reads data
    data_creating: safety - creates data
    data_modifying: safety - modifies existing data
    destructive: safety - deletes data / irreversible
    mobile: intended for mobile emulation
    desktop_only: skip when a mobile device is emulated

filterwarnings =
    ignore::DeprecationWarning:faker.*
    ignore::pytest.PytestUnraisableExceptionWarning

junit_family = xunit2
junit_logging = system-out
junit_suite_name = coca_cola_automation
