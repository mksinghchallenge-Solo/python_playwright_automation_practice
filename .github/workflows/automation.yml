name: Coca-Cola Automation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1-5"        # weekdays 03:00 UTC
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        type: choice
        options: [local, qa, staging, prod]
        default: local
      markers:
        description: "pytest -m expression"
        default: "not accessibility and not links"
      browser:
        description: "chromium | firefox | webkit | chrome | msedge"
        default: chromium
      device:
        description: "Optional device, e.g. Pixel 7"
        default: ""

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    name: ${{ matrix.suite }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: framework
            browser: chromium
          - suite: api
            browser: chromium
          - suite: ui
            browser: chromium
          - suite: ui
            browser: firefox
          - suite: ui
            browser: webkit
          - suite: e2e
            browser: chromium
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Prepare .env (secrets come from GitHub Secrets, never from the repo)
        run: |
          cp .env.example .env
          echo "ENV=${{ github.event.inputs.env || 'local' }}" >> .env
          echo "API_USER_EMAIL=${{ secrets.API_USER_EMAIL || 'demo.user@example.com' }}" >> .env
          echo "API_USER_PASSWORD=${{ secrets.API_USER_PASSWORD || 'Demo@12345' }}" >> .env
          echo "UI_USER_EMAIL=${{ secrets.UI_USER_EMAIL || 'demo.user@example.com' }}" >> .env
          echo "UI_USER_PASSWORD=${{ secrets.UI_USER_PASSWORD || 'Demo@12345' }}" >> .env

      - name: Start local practice app (only for ENV=local)
        if: ${{ (github.event.inputs.env || 'local') == 'local' }}
        run: |
          nohup python sandbox_app/server.py 8765 > practice_app.log 2>&1 &
          sleep 2 && curl -sf http://127.0.0.1:8765/api/health

      - name: Run tests
        run: |
          DEVICE_ARG=""
          if [ -n "${{ github.event.inputs.device }}" ]; then DEVICE_ARG="--device=${{ github.event.inputs.device }}"; fi
          pytest tests/${{ matrix.suite }} \
            --browser=${{ matrix.browser }} $DEVICE_ARG \
            -m "${{ github.event.inputs.markers || 'not accessibility and not links' }}" \
            -n 2 --reruns 1 --reruns-delay 2

      - name: Locate execution folder
        if: always()
        id: exec
        run: |
          EXEC_DIR=$(ls -td reports/*/execution_* | head -1)
          echo "dir=$EXEC_DIR" >> "$GITHUB_OUTPUT"
          echo "Execution folder: $EXEC_DIR"

      - name: Publish JUnit results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit ${{ matrix.suite }} ${{ matrix.browser }}
          path: ${{ steps.exec.outputs.dir }}/junit/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload artifacts (allure-results, junit, screenshots, videos, traces, logs, summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-${{ matrix.suite }}-${{ matrix.browser }}
          path: ${{ steps.exec.outputs.dir }}
          retention-days: 30

  allure-report:
    name: Allure report
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed by peaceiris/actions-gh-pages to push the gh-pages branch
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: executions

      - name: Merge allure-results from all jobs
        run: |
          mkdir -p merged-results
          find executions -type d -name allure-results -exec sh -c 'cp -a "$1"/. merged-results/' _ {} \;
          ls merged-results | head

      # The old step used simple-elf/allure-report-action (a Docker action). Its image
      # is built on runners from a base that no longer exists on Docker Hub, so
      # "docker build" fails with exit code 1 before any step runs. Install the
      # Allure CLI directly instead (ubuntu-latest ships a JDK): no container, no build.
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.46.1
          curl -sSLo allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          sudo tar -xzf allure.tgz -C /opt
          echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate Allure report
        run: |
          allure generate merged-results -o allure-report --clean
          # GitHub Pages (branch source) otherwise runs Jekyll and drops files starting with "_"
          touch allure-report/.nojekyll

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # Publish to GitHub Pages on main. Requires the site to be enabled once with
      # Settings -> Pages -> Source: "Deploy from a branch" -> branch: gh-pages / (root),
      # and the job's contents:write permission above for pushing the branch.
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
          create_branch: true
